name: Release Desktop Apps

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Desktop Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verification checks
        run: |
          pnpm test
          pnpm run typecheck
          pnpm exec vue-tsc --noEmit -p tsconfig.json

      - name: Calculate and bump SemVer version
        id: pkg
        run: |
          node --experimental-strip-types scripts/bump-version.ts

      - name: Build Linux AppImage
        run: pnpm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Windows Portable ZIP
        run: pnpm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag_name }}
          name: WP Translator ${{ steps.pkg.outputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/builds/*.AppImage
            dist/builds/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated package version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bump version to ${{ steps.pkg.outputs.tag_name }} [skip ci]"
            git pull origin main --rebase || true
            git push origin main
          else
            echo "No changes to commit in package.json"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
