<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="wp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded rectangle with emerald active pulse border -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#34d399" stroke-width="18" opacity="0.95" />

  <!-- WordPress circle base -->
  <circle cx="236" cy="246" r="160" fill="none" stroke="url(#wp)" stroke-width="26" filter="url(#shadow)" />

  <!-- WordPress stylized W -->
  <path d="M 126 156 L 198 346 L 236 236 L 274 346 L 346 156" 
        fill="none" stroke="url(#wp)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Translation / Language Badge in bottom-right -->
  <g transform="translate(320, 320)" filter="url(#shadow)">
    <circle cx="68" cy="68" r="68" fill="url(#badge)" />
    <text x="44" y="66" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" fill="#ffffff" text-anchor="middle">A</text>
    <text x="92" y="98" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="40" fill="#ffffff" text-anchor="middle">文</text>
    <path d="M 64 44 Q 82 44 86 56" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <polygon points="88,60 84,52 92,54" fill="#ffffff" />
    <path d="M 72 90 Q 54 90 50 78" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <polygon points="48,74 52,82 44,80" fill="#ffffff" />
  </g>
</svg>
